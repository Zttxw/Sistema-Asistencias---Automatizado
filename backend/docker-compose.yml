services:
  db:
    image: mysql:8.0
    container_name: asistencias_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-asistencias_db}
      MYSQL_USER: ${MYSQL_USER:-asistencias_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-asistencias_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: asistencias_backend
    restart: always
    ports:
      - "8001:8000"
    environment:
      MYSQL_SERVER: db
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-asistencias_db}
      MYSQL_USER: ${MYSQL_USER:-asistencias_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-asistencias_pass}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: asistencias_frontend
    restart: always
    ports:
      - "8082:80"
    environment:
      - VITE_API_URL=http://localhost:8001
    depends_on:
      - backend

volumes:
  mysql_data:
